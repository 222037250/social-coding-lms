<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Modules – Social Coding LMS</title>
    <link rel="stylesheet" href="shared-theme.css">
    <style>
        .mod-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:1.5rem; margin-bottom:1.25rem; }
        .mod-title { font-size:1.25rem; font-weight:700; margin-top:0.35rem; }
        .lesson-block { border-top:1px solid var(--divider); padding:0.9rem 0 0.4rem; margin-top:0.75rem; }
        .lesson-title { font-weight:600; margin-bottom:0.5rem; }
        .kind-icon { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; background:rgba(191,247,71,0.1); flex-shrink:0; }
    </style>
</head>
<body>
<div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div>
<header>
    <div class="header-content">
        <a class="brand" href="/student-dashboard.html"><div class="brand-icon">&lt;/&gt;</div><div><div class="brand-text">Social Coding LMS</div><div class="brand-sub">Learner Portal</div></div></a>
        <div class="header-right">
            <nav class="nav-links">
                <a class="nav-link" href="/student-dashboard.html">Home</a>
                <a class="nav-link active" href="/student-modules.html">Modules</a>
                <a class="nav-link" href="/student-assignments.html">Assignments</a>
                <a class="nav-link" href="/student-attendance.html">Attendance</a>
                <a class="nav-link" href="/student-marks.html">Marks</a>
            </nav>
            <label class="theme-toggle"><span id="themeIcon">🌙</span><div class="toggle-track" onclick="toggleTheme()"><div class="toggle-thumb"></div></div></label>
            <div style="display:flex;align-items:center;gap:0.6rem;"><div class="avatar" id="userAvatar">AD</div><div><div class="user-name" id="userName"></div><div class="user-meta" id="userMeta"></div></div></div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>
</header>
<main>
    <div class="page-header">
        <div class="page-title"> My Modules</div>
        <div class="page-subtitle">Slides and materials from your facilitator — file sizes shown so you know the data cost</div>
    </div>
    <div id="modules"><div style="font-family:'Inter',sans-serif;color:var(--text-secondary);">Loading…</div></div>
</main>

<nav class="bottom-nav">
    <a href="/student-dashboard.html"><span class="nav-icon"></span><span class="nav-label">Home</span></a>
    <a href="/student-modules.html" class="active"><span class="nav-icon"></span><span class="nav-label">Modules</span></a>
    <a href="/student-assignments.html"><span class="nav-icon"></span><span class="nav-label">Work</span></a>
    <a href="/student-attendance.html"><span class="nav-icon"></span><span class="nav-label">Attend</span></a>
    <a href="/student-marks.html"><span class="nav-icon"></span><span class="nav-label">Marks</span></a>
</nav>
<div class="toast" id="toast"><span class="toast-icon">✅</span> <span id="toastMsg"></span></div>
<script src="auth.js"></script>
<script>
    const kindIcon = { slides:'', document:'', link:'🔗', video:'🎬' };
    async function load() {
        requireAuth('student');
        populateHeader();
        const mods = await apiFetch('/api/modules');
        if (!Array.isArray(mods)) return;
        document.getElementById('modules').innerHTML = mods.map(m => `
            <div class="mod-card">
                <span class="module-chip">${m.code}</span>
                <div class="mod-title">${m.title}</div>
                <div style="font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--text-secondary);">${m.description||''}</div>
                ${m.lessons.map(l => `
                    <div class="lesson-block">
                        <div class="lesson-title">Lesson ${l.lesson_order} · ${l.title}</div>
                        ${l.materials.length ? l.materials.map(mat => `
                            <div class="material-row">
                                <div class="kind-icon">${kindIcon[mat.kind]||'📄'}</div>
                                <div style="flex:1;">
                                    <div style="font-weight:600;">${mat.title}</div>
                                    <div class="material-size">${mat.kind}${mat.file_size_kb?` · ${mat.file_size_kb} KB`:''}</div>
                                </div>
                                <a class="btn btn-sm btn-primary" style="text-decoration:none;" href="/api/materials/${mat.id}/download?token=${getToken()}" target="_blank">${mat.file_name?'⬇ Download':'🔗 Open'}</a>
                            </div>`).join('')
                        : '<div style="font-family:Inter,sans-serif;font-size:0.82rem;color:var(--text-muted);">No materials yet.</div>'}
                    </div>`).join('')}
            </div>`).join('');
    }
    document.addEventListener('DOMContentLoaded', () => { initTheme(); load(); });
</script>
</body>
</html>
