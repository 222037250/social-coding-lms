<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Modules – Social Coding LMS</title>
    <link rel="stylesheet" href="shared-theme.css">
    <link rel="manifest" href="/manifest.json">
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#bff747">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        .mod-card { background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px; padding:1.5rem; margin-bottom:1.25rem; }
        .mod-title { font-size:1.25rem; font-weight:700; margin-top:0.35rem; }
        .lesson-block { border-top:1px solid var(--divider); padding:0.9rem 0 0.4rem; margin-top:0.75rem; }
        .lesson-title { font-weight:600; margin-bottom:0.5rem; }
        .kind-icon { width:38px; height:38px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-size:1.1rem; background:rgba(191,247,71,0.1); flex-shrink:0; }
    </style>
</head>
<body>
<div class="bg-glow bg-glow-1"></div><div class="bg-glow bg-glow-2"></div>
<header>
    <div class="header-content">
        <a class="brand" href="/student-dashboard.html"><div class="brand-icon"><img src="/icons/logo-mark-white.png" alt="Social Coding"></div><div><div class="brand-text">Social Coding LMS</div><div class="brand-sub">Learner Portal</div></div></a>
        <div class="header-right">
            <nav class="nav-links">
                <a class="nav-link" href="/student-dashboard.html">Home</a>
                <a class="nav-link active" href="/student-modules.html">Modules</a>
                <a class="nav-link" href="/student-assignments.html">Assignments</a>
                <a class="nav-link" href="/student-attendance.html">Attendance</a>
                <a class="nav-link" href="/student-marks.html">Marks</a>
            </nav>
            <label class="theme-toggle"><span id="themeIcon" class="theme-label">Dark</span><div class="toggle-track" onclick="toggleTheme()"><div class="toggle-thumb"></div></div></label>
            <div style="display:flex;align-items:center;gap:0.6rem;"><div class="avatar" id="userAvatar">AD</div><div><div class="user-name" id="userName"></div><div class="user-meta" id="userMeta"></div></div></div>
            <button class="btn-logout" onclick="logout()">Logout</button>
        </div>
    </div>
</header>
<main>
    <div class="stale-banner" id="staleBanner"></div>
    <div class="page-header">
        <div class="page-title">My Modules</div>
        <div class="page-subtitle">Slides and materials from your facilitator — file sizes shown so you know the data cost</div>
    </div>
    <div class="filter-bar">
        <select class="filter-select" id="modFilter" onchange="renderModules()">
            <option value="">All courses</option>
        </select>
        <input class="filter-search" id="matSearch" placeholder="Search materials…" oninput="renderModules()">
        <span class="filter-count" id="modCount"></span>
    </div>
    <div id="modules"><div style="font-family:'Inter',sans-serif;color:var(--text-secondary);">Loading…</div></div>
</main>

<nav class="bottom-nav">
    <a href="/student-dashboard.html"><span class="nav-label">Home</span></a>
    <a href="/student-modules.html" class="active"><span class="nav-label">Modules</span></a>
    <a href="/student-assignments.html"><span class="nav-label">Work</span></a>
    <a href="/student-attendance.html"><span class="nav-label">Attend</span></a>
    <a href="/student-marks.html"><span class="nav-label">Marks</span></a>
</nav>
<div class="toast" id="toast"><span id="toastMsg"></span></div>
<script src="config.js"></script>
<script src="auth.js"></script>
<script src="offline.js"></script>
<script>
   const kindIcon = { slides:'', document:'', link:'', video:'' };
    let allMods = [];
    function visibleMods() {
        const code = document.getElementById('modFilter')?.value || '';
        const q = (document.getElementById('matSearch')?.value || '').trim().toLowerCase();
        let mods = allMods.filter(m => !code || m.code === code);
        if (q) mods = mods.map(m => ({ ...m, lessons: m.lessons.map(l => ({ ...l,
                    materials: l.materials.filter(mat => (mat.title||'').toLowerCase().includes(q)) }))
                    .filter(l => l.materials.length) })).filter(m => m.lessons.length);
        const n = mods.reduce((t,m)=>t+m.lessons.reduce((x,l)=>x+l.materials.length,0),0);
        const c = document.getElementById('modCount');
        if (c) c.textContent = `${mods.length} course${mods.length===1?'':'s'} · ${n} material${n===1?'':'s'}`;
        return mods;
    }
    function renderModules() { paint(); }

    function paint() {
        const KIND = { slides:'Slides', document:'Document', link:'Link', video:'Video' };
        document.getElementById('modules').innerHTML = visibleMods().map(m => `
            <div class="mod-card">
                <span class="module-chip">${m.code}</span>
                <div class="mod-title">${m.title}</div>
                <div style="font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--text-secondary);margin-bottom:0.9rem;">${m.description||''}</div>
                <div class="table-wrap">
                    <table class="data">
                        <thead><tr><th>Lesson</th><th>Material</th><th>Type</th><th class="num">Size</th><th></th></tr></thead>
                        <tbody>
                        ${m.lessons.flatMap(l => l.materials.length
                            ? l.materials.map(mat => `
                                <tr>
                                    <td class="muted">${l.lesson_order}. ${l.title}</td>
                                    <td class="strong">${mat.title}</td>
                                    <td>${KIND[mat.kind]||mat.kind}</td>
                                    <td class="num">${mat.file_size_kb?mat.file_size_kb+' KB':'—'}</td>
                                    <td class="num"><a class="btn btn-sm btn-primary" style="text-decoration:none;" href="${apiUrl('/api/materials/'+mat.id+'/download?token='+getToken())}" target="_blank">${mat.file_name?'Download':'Open'}</a></td>
                                </tr>`)
                            : [`<tr><td class="muted">${l.lesson_order}. ${l.title}</td><td colspan="4" class="muted">No materials yet</td></tr>`]
                        ).join('')}
                        </tbody>
                    </table>
                </div>
            </div>`).join('');
    }

    function buildModFilter() {
        const sel = document.getElementById('modFilter');
        if (!sel || sel.options.length > 1) return;
        sel.innerHTML = '<option value="">All courses</option>' +
            allMods.map(m => `<option value="${m.code}">${m.code} · ${m.title}</option>`).join('');
    }

    async function load() {
        requireAuth('student');
        populateHeader();
        const _r = await fetchCached('/api/modules');
        setStaleBanner(_r.stale, _r.cachedAt);
        const mods = _r.data;
        allMods = Array.isArray(mods) ? mods : [];
        if (!Array.isArray(mods)) return;
        buildModFilter();
        paint();
    }
    document.addEventListener('DOMContentLoaded', () => { initTheme(); load(); });
</script>
</body>
</html>
